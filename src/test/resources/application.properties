# =============================================================================
# TEST PROFILE — PostgreSQL Testcontainers (no external database required)
# =============================================================================
# This file is only on the test classpath. Every key is %test-scoped so its
# intent is explicit and it never affects dev/prod runs. It makes @QuarkusTest
# boot with NO external services: a throwaway PostgreSQL container started by
# PostgresTestResource, migrated with db/migration + the db/test bootstrap.

# -----------------------------------------------------------------------------
# Database: one shared PostgreSQL container for BOTH datasources.
# -----------------------------------------------------------------------------
# The JDBC url/username/password for both the default and `owner` datasources
# are injected at runtime by PostgresTestResource (com.elicitsoftware.test), a
# QuarkusTestResourceLifecycleManager that starts a single Testcontainers
# PostgreSQL and hands the same URL to both Agroal pools. The container runs as
# superuser `postgres` so the bootstrap migration can CREATE ROLE.
%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.datasource.owner.devservices.enabled=false

# -----------------------------------------------------------------------------
# Flyway (test): prepend the db/test bootstrap that creates the cross-module
# roles/schemas/tables FHHS's migrations assume already exist. Ordering is by
# version (V0.0.0.1 < V0.0.1), not by location list.
# -----------------------------------------------------------------------------
%test.quarkus.flyway.owner.locations=db/migration,db/test
%test.quarkus.flyway.owner.schemas=survey

# -----------------------------------------------------------------------------
# Never build/push a container image during the test lifecycle.
# -----------------------------------------------------------------------------
%test.quarkus.container-image.build=false
%test.quarkus.container-image.push=false

# -----------------------------------------------------------------------------
# Quiet + fast
# -----------------------------------------------------------------------------
%test.quarkus.hibernate-orm.log.sql=false
%test.quarkus.hibernate-orm.statistics=false
